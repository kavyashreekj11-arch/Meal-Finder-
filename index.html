<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MealFinder</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <!-- ==========================================
         NAVBAR
    =========================================== -->

    <header>

        <nav>

            <div class="logo">

                <span
                    class="home-icon"
                    title="Home"
                >
                    ⌂
                </span>

                <span class="logo-text">
                    MealFinder.
                </span>

            </div>


            <button
                class="menu-btn"
                aria-label="Open menu"
            >
                ☰
            </button>


            <aside id="categoryMenu">

                <button
                    id="closeMenu"
                    aria-label="Close menu"
                >
                    ×
                </button>

                <div id="menuCategories"></div>

            </aside>

        </nav>

    </header>


    <!-- ==========================================
         HERO
    =========================================== -->

    <section class="hero">

        <div class="hero-content">

            <div class="search-container">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search recipes here..."
                >

                <button
                    id="searchBtn"
                    aria-label="Search"
                >
                    🔍
                </button>

            </div>


            <h1>
                What are your favorite cuisines?
            </h1>


            <p>
                PERSONALIZE YOUR EXPERIENCE
            </p>

        </div>

    </section>


    <!-- ==========================================
         SEARCH RESULTS
    =========================================== -->

    <section
        class="search-results-section"
        id="searchResultsSection"
    >

        <h2>
            MEALS
        </h2>

        <div id="searchResultsContainer"></div>

    </section>


    <!-- ==========================================
         CATEGORY PAGE
    =========================================== -->

    <section
        class="category-page"
        id="categoryPage"
    >

        <div class="category-info">

            <h1 id="categoryTitle"></h1>

            <p id="categoryDescription"></p>

        </div>


        <div class="category-meals">

            <h2>
                MEALS
            </h2>

            <div id="categoryMealsContainer"></div>

        </div>

    </section>


    <!-- ==========================================
         MEAL DETAILS PAGE
    =========================================== -->

    <section
        class="meal-details-page"
        id="mealDetailsPage"
    >

        <div class="meal-details-wrapper">


            <!-- BREADCRUMB -->

            <div class="meal-breadcrumb">

                <span class="breadcrumb-home">
                    ⌂
                </span>

                <span>
                    »
                </span>

                <span id="breadcrumbMealName">
                    MEAL DETAILS
                </span>

            </div>


            <!-- HEADING -->

            <div class="meal-details-heading">

                <h2>
                    MEAL DETAILS
                </h2>

            </div>


            <!-- MAIN MEAL INFORMATION -->

            <div class="meal-details-card">


                <!-- IMAGE -->

                <div class="meal-details-image-wrapper">

                    <img
                        id="mealDetailsImage"
                        src=""
                        alt=""
                    >

                </div>


                <!-- INFORMATION -->

                <div class="meal-details-information">

                    <h1 id="mealDetailsTitle"></h1>

                    <div class="details-line"></div>


                    <p class="detail-row">

                        <strong>
                            CATEGORY:
                        </strong>

                        <span id="mealDetailsCategory"></span>

                    </p>


                    <p class="detail-row">

                        <strong>
                            Source:
                        </strong>

                        <span id="mealDetailsSource"></span>

                    </p>


                    <p
                        class="detail-row tags-row"
                        id="mealDetailsTagsRow"
                    >

                        <strong>
                            Tags:
                        </strong>

                        <span
                            id="mealDetailsTags"
                            class="tag-value"
                        ></span>

                    </p>


                    <!-- INGREDIENTS -->

                    <div class="ingredients-box">

                        <h3>
                            Ingredients
                        </h3>

                        <div
                            id="ingredientsContainer"
                            class="ingredients-list"
                        ></div>

                    </div>

                </div>

            </div>


            <!-- MEASURE -->

            <div class="measure-section">

                <h3>
                    Measure:
                </h3>

                <div
                    id="measureContainer"
                    class="measure-grid"
                ></div>

            </div>


            <!-- INSTRUCTIONS -->

            <div class="instructions-section">

                <h3>
                    Instructions:
                </h3>

                <div
                    id="instructionsContainer"
                    class="instructions-list"
                ></div>

            </div>

        </div>

    </section>


    <!-- ==========================================
         CATEGORIES

         IMPORTANT:
         This comes AFTER meal-details-page
         so it naturally appears underneath
         the meal details page.
    =========================================== -->

    <section
        class="categories-section"
        id="categoriesSection"
    >

        <h2>
            CATEGORIES
        </h2>

        <div id="categoriesContainer"></div>

    </section>


    <script src="js/app.js"></script>

</body>

</html>
